name: 定时任务

# 定时入口，只有三步：构建 → 迁移 → 清理。
# 两份清单的解析与矩阵展开都在各自的流水线内部完成，这里只负责触发与串联。
on:
  schedule:
    - cron: "0 4 * * *" # 每天 UTC 04:00（北京时间 12:00）
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/build-list.json"
      - "config/migrate-list.json"
      - ".github/workflows/schedule.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/migrate.yml"

permissions:
  contents: read
  packages: write # 推送到 GHCR 需要

jobs:
  # 与迁移并行，读 config/build-list.json
  build:
    name: 构建镜像
    uses: ./.github/workflows/build.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # 与构建并行，读 config/migrate-list.json
  migrate:
    name: 迁移镜像
    uses: ./.github/workflows/migrate.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # 等构建与迁移都结束后再清理，避免正在跑的任务被当成历史记录处理。
  # always() 保证构建或迁移失败时依然会执行清理。
  cleanup-workflow-runs:
    name: 清理历史运行记录
    needs: [build, migrate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 删除旧 Actions
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.CLEANUP_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
