name: 迁移镜像

# 从 config/migrate-list.json 读取镜像清单，用 skopeo 在 registry 之间直连复制：
# 不落本地磁盘、不重建、保留全部架构与原始 digest，同时落地 Docker Hub 与 GHCR。
on:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 03:00（北京时间 11:00）
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/migrate-list.json"
      - ".github/workflows/migrate.yml"

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: 生成迁移矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@main

      - name: 解析迁移清单
        id: matrix
        run: |
          set -euo pipefail
          if [ "$(jq 'length' config/migrate-list.json)" -eq 0 ]; then
            echo "错误: config/migrate-list.json 为空，没有可迁移的镜像" >&2
            exit 1
          fi
          value=$(jq -c '
            map({
              source_img:  .source_img,
              hub_name:    .hub_name,
              tag:         .tag,
              target_tags: (.target_tags // [.tag])
            }) | {include: .}
          ' config/migrate-list.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"

  migrate:
    name: 迁移 ${{ matrix.hub_name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: 安装 skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      # GHCR 要求仓库路径全小写，Docker Hub 同样不接受大写
      - name: 解析镜像仓库
        id: repo
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image=$(printf '%s' "${{ matrix.hub_name }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$owner" ] || [ -z "$image" ]; then
            echo "错误: 镜像仓库名解析为空" >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@master
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 复制镜像
        env:
          SRC_IMG: ${{ matrix.source_img }}:${{ matrix.tag }}
          HUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo.outputs.image }}
          GHCR_REPO: ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}
          GHCR_PAGE: https://github.com/${{ github.repository }}/pkgs/container/${{ steps.repo.outputs.image }}
          TARGET_TAGS: ${{ join(matrix.target_tags, ' ') }}
        run: |
          set -euo pipefail
          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$authfile" ]; then
            echo "错误: 未找到 Docker 凭据文件 $authfile" >&2
            exit 1
          fi

          tags=()
          for tag in $TARGET_TAGS; do
            tags+=("$tag")
          done
          if [ ${#tags[@]} -eq 0 ]; then
            echo "错误: 目标标签为空" >&2
            exit 1
          fi

          # --all 不可省略：skopeo 默认只复制当前系统架构，
          # 加 --all 才会把多架构索引及其全部子镜像一起复制
          copy() {
            skopeo copy --all --retry-times 3 --authfile "$authfile" "docker://$1" "docker://$2"
          }
          digest_of() {
            skopeo inspect --raw --authfile "$authfile" "docker://$1" | sha256sum | cut -d' ' -f1
          }

          echo "源镜像: $SRC_IMG"
          echo "Docker Hub: $HUB_REPO (${tags[*]})"
          echo "GHCR: $GHCR_REPO (${tags[*]})"

          # 1. 源 → Docker Hub 第一个标签（含全部架构）
          copy "$SRC_IMG" "$HUB_REPO:${tags[0]}"

          # 2. Docker Hub 其余标签，registry 侧直接复用已有 blob
          for tag in "${tags[@]:1}"; do
            copy "$HUB_REPO:${tags[0]}" "$HUB_REPO:$tag"
          done

          # 3. Docker Hub → GHCR 第一个标签
          copy "$HUB_REPO:${tags[0]}" "$GHCR_REPO:${tags[0]}"

          # 4. GHCR 其余标签
          for tag in "${tags[@]:1}"; do
            copy "$GHCR_REPO:${tags[0]}" "$GHCR_REPO:$tag"
          done

          src_digest=$(digest_of "$SRC_IMG")
          hub_digest=$(digest_of "$HUB_REPO:${tags[0]}")
          ghcr_digest=$(digest_of "$GHCR_REPO:${tags[0]}")
          echo "源 digest: $src_digest"
          echo "Docker Hub digest: $hub_digest"
          echo "GHCR digest: $ghcr_digest"

          mismatch=0
          if [ "$src_digest" != "$hub_digest" ] || [ "$src_digest" != "$ghcr_digest" ]; then
            mismatch=1
            echo "警告: digest 与源镜像不一致，源镜像可能被 registry 重新序列化，请人工确认"
          fi

          {
            echo "## 迁移完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源镜像 | \`$SRC_IMG\` |"
            echo "| 源 digest | \`$src_digest\` |"
            echo "| Docker Hub 镜像 | [\`$HUB_REPO\`](https://hub.docker.com/r/$HUB_REPO) |"
            echo "| Docker Hub digest | \`$hub_digest\` |"
            echo "| GHCR 镜像 | [\`$GHCR_REPO\`]($GHCR_PAGE) |"
            echo "| GHCR digest | \`$ghcr_digest\` |"
            echo "| 目标标签 | \`${tags[*]}\` |"
            echo ""
            if [ "$mismatch" -eq 1 ]; then
              echo "> 注意：目标 digest 与源镜像不一致，请人工确认镜像是否被重新序列化。"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
