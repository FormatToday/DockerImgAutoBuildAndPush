name: 迁移镜像

# 从 config/migrate-list.json 读取镜像清单，用 skopeo 在 registry 之间直连复制：
# 不落本地磁盘、不重建、保留全部架构与原始 digest，同时落地 Docker Hub 与 GHCR。
# 定时执行由 schedule.yml 统一调度，这里不再单独配 cron，避免同一天跑两遍。
on:
  workflow_call:
    secrets:
      # 只接收 token。用户名不要再走 secret，否则摘要里的仓库地址会被掩码成 ***
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/migrate-list.json"

permissions:
  contents: read
  packages: write

# 注意：不要把它写成 ${{ secrets.DOCKERHUB_USERNAME }}。GitHub 会对当前 job 中用到的
# secret 值在日志和运行摘要里做全文替换，写死的常量只要和 secret 值相同也会被替换成 ***。
env:
  HUB_OWNER: formattoday
  GHCR_OWNER: formattoday

jobs:
  plan:
    name: 生成迁移矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@main

      - name: 解析迁移清单
        id: matrix
        run: |
          set -euo pipefail
          if [ "$(jq 'length' config/migrate-list.json)" -eq 0 ]; then
            echo "错误: config/migrate-list.json 为空，没有可迁移的镜像" >&2
            exit 1
          fi
          value=$(jq -c '
            map({
              source_img:  .source_img,
              hub_name:    .hub_name,
              tag:         .tag,
              target_tags: (.target_tags // [.tag])
            }) | {include: .}
          ' config/migrate-list.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"

  migrate:
    name: 迁移 ${{ matrix.hub_name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: 安装 skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: 解析镜像名
        id: repo
        run: |
          set -euo pipefail
          image=$(printf '%s' "${{ matrix.hub_name }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$image" ]; then
            echo "错误: 镜像名为空" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@master
        with:
          username: ${{ env.HUB_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@master
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 复制镜像
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.repo.outputs.image }}
          SRC_IMG: ${{ matrix.source_img }}:${{ matrix.tag }}
          HUB_REPO: ${{ env.HUB_OWNER }}/${{ steps.repo.outputs.image }}
          GHCR_REPO: ghcr.io/${{ env.GHCR_OWNER }}/${{ steps.repo.outputs.image }}
          GHCR_PAGE: https://github.com/${{ github.repository }}/pkgs/container/${{ steps.repo.outputs.image }}
          TARGET_TAGS: ${{ join(matrix.target_tags, ' ') }}
        run: |
          set -euo pipefail
          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$authfile" ]; then
            echo "错误: 未找到 Docker 凭据文件 $authfile" >&2
            exit 1
          fi

          tags=()
          for tag in $TARGET_TAGS; do
            tags+=("$tag")
          done
          if [ ${#tags[@]} -eq 0 ]; then
            echo "错误: 目标标签为空" >&2
            exit 1
          fi

          # --all 不可省略：skopeo 默认只复制当前系统架构，
          # 加 --all 才会把多架构索引及其全部子镜像一起复制
          copy() {
            skopeo copy --all --retry-times 3 --authfile "$authfile" "docker://$1" "docker://$2"
          }
          digest_of() {
            skopeo inspect --raw --authfile "$authfile" "docker://$1" | sha256sum | cut -d' ' -f1
          }

          echo "源镜像: $SRC_IMG"
          echo "Docker Hub: $HUB_REPO (${tags[*]})"
          echo "GHCR: $GHCR_REPO (${tags[*]})"

          # 1. 源 → Docker Hub 第一个标签（含全部架构）
          copy "$SRC_IMG" "$HUB_REPO:${tags[0]}"

          # 2. Docker Hub 其余标签，registry 侧直接复用已有 blob
          for tag in "${tags[@]:1}"; do
            copy "$HUB_REPO:${tags[0]}" "$HUB_REPO:$tag"
          done

          # 3. Docker Hub → GHCR 第一个标签
          copy "$HUB_REPO:${tags[0]}" "$GHCR_REPO:${tags[0]}"

          # 4. GHCR 其余标签
          for tag in "${tags[@]:1}"; do
            copy "$GHCR_REPO:${tags[0]}" "$GHCR_REPO:$tag"
          done

          src_digest=$(digest_of "$SRC_IMG")
          hub_digest=$(digest_of "$HUB_REPO:${tags[0]}")
          ghcr_digest=$(digest_of "$GHCR_REPO:${tags[0]}")
          echo "源 digest: $src_digest"
          echo "Docker Hub digest: $hub_digest"
          echo "GHCR digest: $ghcr_digest"

          # GHCR 的包页面只有形如 .../pkgs/container/镜像/版本ID?tag=标签 才能定位到具体标签，
          # 只加 ?tag= 会停在默认标签上。版本 ID 需要查 API，查不到就退回包页面本身。
          ghcr_link() {
            local tag="$1" api id
            for api in "orgs/${GHCR_OWNER}" "users/${GHCR_OWNER}"; do
              id=$(curl -fsSL -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GH_API_TOKEN}" \
                      "https://api.github.com/${api}/packages/container/${IMAGE_NAME}/versions?per_page=100" 2>/dev/null \
                    | jq -r --arg t "$tag" '[.[]? | select(.metadata.container.tags // [] | index($t))][0].id // empty' 2>/dev/null) || true
              if [ -n "${id:-}" ]; then
                printf '%s/%s?tag=%s' "$GHCR_PAGE" "$id" "$tag"
                return 0
              fi
            done
            printf '%s' "$GHCR_PAGE"
          }

          {
            echo "## 迁移完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源镜像 | \`$SRC_IMG\` |"
            echo "| Docker Hub | \`$HUB_REPO\` |"
            echo "| GHCR | \`$GHCR_REPO\` |"
            echo "| 目标标签 | \`${tags[*]}\` |"
            echo "| 复制方式 | \`skopeo copy --all\`（保留全部架构） |"
            echo ""
            echo "### 各标签直达链接"
            echo ""
            echo "| 标签 | Docker Hub | GHCR |"
            echo "| --- | --- | --- |"
            for tag in "${tags[@]}"; do
              echo "| \`$tag\` | [Docker Hub](https://hub.docker.com/r/$HUB_REPO/tags?name=$tag) | [GHCR]($(ghcr_link "$tag")) |"
            done
            echo ""
            echo "### digest 校验"
            echo ""
            echo "| 位置 | digest |"
            echo "| --- | --- |"
            echo "| 源镜像 | \`$src_digest\` |"
            echo "| Docker Hub | \`$hub_digest\` |"
            echo "| GHCR | \`$ghcr_digest\` |"
            echo ""
            if [ "$src_digest" != "$hub_digest" ] || [ "$src_digest" != "$ghcr_digest" ]; then
              echo "> 注意：目标 digest 与源镜像不一致，源镜像可能被 registry 重新序列化，请人工确认。"
              echo ""
            fi
            echo "拉取命令："
            echo ""
            echo '```bash'
            echo "docker pull $HUB_REPO:${tags[0]}"
            echo "docker pull $GHCR_REPO:${tags[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
