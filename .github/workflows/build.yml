name: 构建镜像

# 读 config/build-list.json 生成矩阵，逐项检出源码 → 构建 → 同时推送到 Docker Hub 与 GHCR。
# 矩阵在内部完成，调用方（schedule.yml）只需一行 uses，不用再自己解析清单。
on:
  workflow_call:
    secrets:
      # 只接收 token。用户名不要再走 secret：GitHub 会对「当前 job 中用到的 secret 值」
      # 在日志与运行摘要里做全文替换，用户名若以 secret 形式引入，摘要里的仓库地址会变成 ***
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/build-list.json"

permissions:
  contents: read
  packages: write

# Docker Hub 用户名与 GitHub 命名空间不同名时，改这里的 HUB_OWNER 即可。
# 注意：不要把它写成 ${{ secrets.DOCKERHUB_USERNAME }}。GitHub 会对当前 job 中用到的
# secret 值在日志和运行摘要里做全文替换，写死的常量只要和 secret 值相同也会被替换成 ***。
env:
  HUB_OWNER: formattoday
  GHCR_OWNER: formattoday

jobs:
  plan:
    name: 生成构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@main

      - name: 解析构建清单
        id: matrix
        run: |
          set -euo pipefail
          if [ "$(jq 'length' config/build-list.json)" -eq 0 ]; then
            echo "错误: config/build-list.json 为空，没有可构建的项目" >&2
            exit 1
          fi
          # branch 为空表示用源码仓库的默认分支；兼容旧字段 source_ref（两者同时存在时以 branch 为准）
          value=$(jq -c '
            map({
              source_repo,
              docker_image_name,
              branch:           (.branch // .source_ref // ""),
              dockerfile_path:  (.dockerfile_path  // "Dockerfile"),
              context_path:     (.context_path     // "."),
              platforms:        (.platforms        // "linux/amd64"),
              additional_tags:  (.additional_tags  // "")
            }) | {include: .}
          ' config/build-list.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.docker_image_name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # branch 除了分支名，也可以填 tag 或 commit，最终都交给 checkout 的 ref
      - name: 检出源码仓库
        uses: actions/checkout@main
        with:
          repository: ${{ matrix.source_repo }}
          ref: ${{ matrix.branch }}
          path: src
          submodules: recursive

      # GHCR 要求仓库路径全小写，Docker Hub 同样不接受大写
      - name: 解析镜像名
        id: repo
        run: |
          set -euo pipefail
          image=$(printf '%s' "${{ matrix.docker_image_name }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$image" ]; then
            echo "错误: 镜像名为空" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@master

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@master

      - name: 登录 Docker Hub
        uses: docker/login-action@master
        with:
          username: ${{ env.HUB_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@master
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同一批标签会同时打到两个仓库
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@master
        with:
          images: |
            ${{ env.HUB_OWNER }}/${{ steps.repo.outputs.image }}
            ghcr.io/${{ env.GHCR_OWNER }}/${{ steps.repo.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD'}}
            ${{ matrix.additional_tags }}

      - name: 构建并推送
        uses: docker/build-push-action@master
        env:
          # 该 action 默认会自己写一份英文 Job Summary，关闭后只保留下面的中文摘要
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: ./src/${{ matrix.context_path }}
          file: ./src/${{ matrix.dockerfile_path }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.docker_image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.docker_image_name }}

      - name: 输出运行摘要
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.repo.outputs.image }}
          HUB_REPO: ${{ env.HUB_OWNER }}/${{ steps.repo.outputs.image }}
          GHCR_REPO: ghcr.io/${{ env.GHCR_OWNER }}/${{ steps.repo.outputs.image }}
          GHCR_PAGE: https://github.com/${{ github.repository }}/pkgs/container/${{ steps.repo.outputs.image }}
          SOURCE_REPO: ${{ matrix.source_repo }}
          SOURCE_BRANCH: ${{ matrix.branch }}
          PLATFORMS: ${{ matrix.platforms }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # metadata-action 输出的标签形如 owner/镜像:标签、ghcr.io/owner/镜像:标签，
          # 两个仓库的标签完全相同，取非 ghcr.io 的那一半去重即可
          tag_list=$(printf '%s\n' "$IMAGE_TAGS" | grep -v '^ghcr\.io/' | sed 's/.*://' | awk 'NF && !seen[$0]++')
          if [ -z "$tag_list" ]; then
            echo "错误: 没有解析到任何标签" >&2
            exit 1
          fi

          # GHCR 的包页面只有形如 .../pkgs/container/镜像/版本ID?tag=标签 才能定位到具体标签，
          # 只加 ?tag= 会停在默认标签上。版本 ID 需要查 API，查不到就退回包页面本身。
          ghcr_link() {
            local tag="$1" api id
            for api in "orgs/${GHCR_OWNER}" "users/${GHCR_OWNER}"; do
              id=$(curl -fsSL -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GH_API_TOKEN}" \
                      "https://api.github.com/${api}/packages/container/${IMAGE_NAME}/versions?per_page=100" 2>/dev/null \
                    | jq -r --arg t "$tag" '[.[]? | select(.metadata.container.tags // [] | index($t))][0].id // empty' 2>/dev/null) || true
              if [ -n "${id:-}" ]; then
                printf '%s/%s?tag=%s' "$GHCR_PAGE" "$id" "$tag"
                return 0
              fi
            done
            printf '%s' "$GHCR_PAGE"
          }

          {
            echo "## 构建完成"
            echo ""
            echo "镜像 \`$IMAGE_NAME\` 已同时推送到 Docker Hub 与 GHCR。"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码仓库 | \`$SOURCE_REPO\` |"
            echo "| 源码分支 | \`${SOURCE_BRANCH:-默认分支}\` |"
            echo "| 目标平台 | \`$PLATFORMS\` |"
            echo "| Docker Hub | \`$HUB_REPO\` |"
            echo "| GHCR | \`$GHCR_REPO\` |"
            echo ""
            echo "### 本次推送的标签"
            echo ""
            echo "| 标签 | Docker Hub | GHCR |"
            echo "| --- | --- | --- |"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "| \`$tag\` | [Docker Hub](https://hub.docker.com/r/$HUB_REPO/tags?name=$tag) | [GHCR]($(ghcr_link "$tag")) |"
            done <<< "$tag_list"
            echo ""
            echo "拉取命令："
            echo ""
            echo '```bash'
            echo "docker pull $HUB_REPO:$(printf '%s\n' "$tag_list" | awk 'NR==1')"
            echo "docker pull $GHCR_REPO:$(printf '%s\n' "$tag_list" | awk 'NR==1')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
