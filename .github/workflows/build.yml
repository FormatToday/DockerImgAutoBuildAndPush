name: 构建镜像

# 可复用工作流：检出指定仓库 → 构建 Docker 镜像 → 同时推送到 Docker Hub 与 GHCR
on:
  workflow_call:
    inputs:
      source_repo:
        description: 源码仓库，格式 owner/repo
        required: true
        type: string
      docker_image_name:
        description: 镜像名（不含用户名），两个仓库共用
        required: true
        type: string
      source_ref:
        description: 分支 / tag / commit，留空使用仓库默认分支
        required: false
        type: string
        default: ""
      dockerfile_path:
        description: Dockerfile 路径，相对仓库根目录
        required: false
        type: string
        default: "Dockerfile"
      context_path:
        description: 构建上下文，相对仓库根目录
        required: false
        type: string
        default: "."
      platforms:
        description: 目标平台，逗号分隔
        required: false
        type: string
        default: "linux/amd64"
      additional_tags:
        description: 额外标签，使用 docker/metadata-action 的 tag 语法，每行一个
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ inputs.docker_image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出源码仓库
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: src
          submodules: recursive

      # GHCR 要求仓库路径全小写，Docker Hub 同样不接受大写
      - name: 解析镜像仓库
        id: repo
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image=$(printf '%s' "${{ inputs.docker_image_name }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$owner" ] || [ -z "$image" ]; then
            echo "错误: 镜像仓库名解析为空" >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@master

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@master

      - name: 登录 Docker Hub
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@master
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同一批标签会同时打到两个仓库
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@master
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo.outputs.image }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD'}}
            ${{ inputs.additional_tags }}

      - name: 构建并推送
        uses: docker/build-push-action@master
        with:
          context: ./src/${{ inputs.context_path }}
          file: ./src/${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.docker_image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.docker_image_name }}

      - name: 输出运行摘要
        env:
          IMAGE_NAME: ${{ steps.repo.outputs.image }}
          HUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo.outputs.image }}
          GHCR_REPO: ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}
          GHCR_PAGE: https://github.com/${{ github.repository }}/pkgs/container/${{ steps.repo.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "## 构建完成"
            echo ""
            echo "镜像 \`$IMAGE_NAME\` 已同时推送到 Docker Hub 与 GHCR。"
            echo ""
            echo "| 仓库 | 镜像地址 | 页面链接 |"
            echo "| --- | --- | --- |"
            echo "| Docker Hub | \`$HUB_REPO\` | https://hub.docker.com/r/$HUB_REPO |"
            echo "| GHCR | \`$GHCR_REPO\` | $GHCR_PAGE |"
            echo ""
            echo "本次推送的标签："
            echo ""
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
